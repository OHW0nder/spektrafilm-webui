<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spektrafilm</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>spektrafilm</h1>
    <span class="sub">光谱胶片模拟</span>
  </div>
  <div class="status">
    <span id="engine-badge" class="badge">…</span>
    <span id="timing" class="dim"></span>
  </div>
</header>

<main>
  <section class="stage">
    <div id="dropzone" class="dropzone">
      <input type="file" id="file" accept=".png,.jpg,.jpeg,.tif,.tiff,.exr" hidden>
      <p>拖入图片，或点击选择</p>
      <p class="dim">TIFF / EXR / PNG / JPEG · 建议场景线性宽色域</p>
    </div>
    <figure id="preview-wrap" hidden>
      <img id="preview" alt="预览">
      <figcaption id="preview-meta" class="dim"></figcaption>
    </figure>
    <div id="render-panel" class="render" hidden>
      <button id="render" class="primary">导出全分辨率 (f64)</button>
      <div id="render-status" class="dim"></div>
    </div>
  </section>

  <aside class="controls">
    <div class="profile-row">
      <label>输入编码
        <select id="input-encoding">
          <option value="auto">自动（PNG/JPEG=sRGB，TIFF/EXR=线性）</option>
          <option value="srgb">sRGB 编码</option>
          <option value="linear">场景线性</option>
        </select>
      </label>
      <label>胶片
        <select id="film"></select>
      </label>
      <label>相纸
        <select id="print"></select>
      </label>
    </div>
    <div id="sections"></div>
    <details class="advanced">
      <summary>高级：原始参数 (JSON)</summary>
      <textarea id="extra" spellcheck="false" placeholder='{"camera.lens_blur_um": 2.0}'></textarea>
      <button id="apply-extra">应用</button>
    </details>
  </aside>
</main>

<footer class="dim">
  预览走 wgpu/Vulkan (f32)，导出走 Python f64 参考实现 ·
  <span id="health">…</span>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
